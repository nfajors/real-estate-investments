[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-engine"
version = "1.0.0"
description = "Axiom deterministic commercial real estate financial calculation engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "numpy-financial>=1.0"]

[tool.setuptools.packages.find]
include = ["axiom_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["axiom_engine"]

[tool.coverage.report]
fail_under = 100
show_missing = true
