name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Financial engine (100% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e "packages/financial-engine[test]"
      - run: cd packages/financial-engine && pytest --cov

  api:
    name: API integration tests (Postgres + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: axiom_test
          POSTGRES_USER: axiom_owner
          POSTGRES_PASSWORD: axiom_owner
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install LibreOffice (recalculates the Excel export in tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -e packages/financial-engine -e "apps/api[test]" pypdf
      - name: Create RLS-bound app role and migrate
        env:
          PGPASSWORD: axiom_owner
          AXIOM_DATABASE_URL: postgresql+psycopg://axiom_owner:axiom_owner@localhost/axiom_test
          AXIOM_DB_APP_ROLE: axiom_app
        run: |
          psql -h localhost -U axiom_owner -d axiom_test -c "CREATE ROLE axiom_app LOGIN PASSWORD 'axiom_app' NOSUPERUSER NOBYPASSRLS;"
          cd apps/api && alembic upgrade head
      - name: Tests on SQLite
        run: cd apps/api && pytest
      - name: Tests on Postgres as the app role (RLS enforced)
        env:
          AXIOM_TEST_DATABASE_URL: postgresql+psycopg://axiom_app:axiom_app@localhost/axiom_test
        run: cd apps/api && pytest

  web:
    name: Web typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/web && npm ci
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npm run lint
      - run: cd apps/web && npm run build
