[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-api"
version = "1.0.0"
description = "Axiom CRE underwriting platform – FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "cryptography>=42",
  "psycopg[binary]>=3.1",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.0",
  "anthropic>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
